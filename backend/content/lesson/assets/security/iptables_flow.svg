<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380">
  <style>
    .box { fill:#f8fafc; stroke:#111827; stroke-width:1.5; }
    .tbl { fill:#eef2ff; stroke:#3730a3; stroke-width:1.5; }
    .title { font: 700 16px 'Segoe UI', Arial, sans-serif; fill:#0f172a; }
    .label { font: 600 13px 'Segoe UI', Arial, sans-serif; fill:#111827; }
    .sub { font: 12px 'Segoe UI', Arial, sans-serif; fill:#334155; }
    .arrow { stroke:#0f172a; stroke-width:1.5; marker-end:url(#m); fill:none; }
  </style>
  <defs>
    <marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#0f172a"/>
    </marker>
  </defs>
  <rect x="10" y="10" width="800" height="360" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="30" y="40" class="title">Netfilter 패킷 경로와 테이블/체인</text>

  <!-- Flow boxes -->
  <g transform="translate(40,70)">
    <rect class="box" x="0" y="0" width="140" height="48"/>
    <text x="15" y="30" class="label">PREROUTING</text>
    <rect class="box" x="180" y="0" width="140" height="48"/>
    <text x="215" y="30" class="label">INPUT</text>
    <rect class="box" x="180" y="100" width="140" height="48"/>
    <text x="212" y="130" class="label">FORWARD</text>
    <rect class="box" x="180" y="200" width="140" height="48"/>
    <text x="210" y="230" class="label">OUTPUT</text>
    <rect class="box" x="360" y="200" width="160" height="48"/>
    <text x="400" y="230" class="label">POSTROUTING</text>

    <!-- Arrows -->
    <path class="arrow" d="M140,24 L178,24"/>
    <path class="arrow" d="M250,48 C250,70 250,90 250,100"/>
    <path class="arrow" d="M250,148 C250,170 250,190 250,200"/>
    <path class="arrow" d="M320,224 L358,224"/>

    <!-- Annotations for tables -->
    <rect class="tbl" x="10" y="-40" width="120" height="28" rx="4"/>
    <text x="20" y="-20" class="sub">nat(DNAT)</text>

    <rect class="tbl" x="200" y="-40" width="120" height="28" rx="4"/>
    <text x="220" y="-20" class="sub">filter(INPUT)</text>

    <rect class="tbl" x="200" y="60" width="120" height="28" rx="4"/>
    <text x="215" y="80" class="sub">filter(FORWARD)</text>

    <rect class="tbl" x="200" y="160" width="120" height="28" rx="4"/>
    <text x="218" y="180" class="sub">filter(OUTPUT)</text>

    <rect class="tbl" x="370" y="160" width="140" height="28" rx="4"/>
    <text x="385" y="180" class="sub">nat(SNAT/MASQ)</text>

    <!-- Directions -->
    <text x="-5" y="16" class="sub">수신</text>
    <text x="345" y="216" class="sub">송신/라우팅 후</text>
  </g>
</svg>

