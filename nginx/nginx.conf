events {
    worker_connections 1024;
}

http {
    # HTTP 서버: 모든 HTTP 요청을 HTTPS로 리디렉션
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    # HTTPS 서버
    server {
  	listen 443 ssl;
  	server_name coretechnet.ddns.net;

  	ssl_certificate     /etc/letsencrypt/live/coretechnet.ddns.net/fullchain.pem;
  	ssl_certificate_key /etc/letsencrypt/live/coretechnet.ddns.net/privkey.pem;

        # SSL 프로토콜 및 암호화 스위트 설정 (보안 강화)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # 모든 요청을 프론트엔드 컨테이너로 전달
        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
