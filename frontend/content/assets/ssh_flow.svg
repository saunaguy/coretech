<svg xmlns="http://www.w3.org/2000/svg" width="860" height="260" viewBox="0 0 860 260">
  <style>
    .title { font: 600 18px 'Segoe UI', Arial; fill:#111827; }
    .label { font: 14px 'Segoe UI', Arial; fill:#111827; }
    .box { fill:#f9fafb; stroke:#111827; stroke-width:2; rx:10; ry:10; }
  </style>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="30" class="title">SSH 접속 흐름 (키 인증)</text>

  <rect class="box" x="40" y="60" width="220" height="140"/>
  <text x="60" y="95" class="label">Client</text>
  <text x="60" y="120" class="label">ssh user@host</text>
  <text x="60" y="145" class="label">id_rsa (private key)</text>

  <rect class="box" x="600" y="60" width="220" height="140"/>
  <text x="620" y="95" class="label">Server</text>
  <text x="620" y="120" class="label">22/tcp (sshd)</text>
  <text x="620" y="145" class="label">~/.ssh/authorized_keys</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#111827" />
    </marker>
  </defs>
  <line x1="260" y1="130" x2="600" y2="130" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="360" y="120" class="label">키 교환 · 인증 · 암호화 세션 수립</text>

  <text x="40" y="220" class="label">권장: PasswordAuthentication no · 키 권한 600</text>
</svg>

