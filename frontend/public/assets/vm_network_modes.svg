<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420">
  <style>
    .title { font: 600 18px 'Segoe UI', Arial; fill:#111827; }
    .label { font: 14px 'Segoe UI', Arial; fill:#111827; }
    .box { fill:#f9fafb; stroke:#111827; stroke-width:2; rx:10; ry:10; }
    .vm { fill:#e0f2fe; stroke:#0369a1; stroke-width:2; rx:8; ry:8; }
    .host { fill:#eef2ff; stroke:#3730a3; stroke-width:2; rx:8; ry:8; }
    .internet { fill:#fef3c7; stroke:#92400e; stroke-width:2; rx:20; ry:20; }
  </style>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="30" class="title">VM 네트워크 모드 비교 (NAT / Bridged / Host-only)</text>

  <!-- Panels -->
  <g transform="translate(20,50)">
    <!-- NAT Panel -->
    <rect class="box" x="0" y="0" width="300" height="340"/>
    <text x="20" y="30" class="label">NAT</text>
    <rect class="host" x="20" y="60" width="260" height="110"/>
    <text x="35" y="90" class="label">Host</text>
    <rect class="vm" x="40" y="120" width="220" height="40"/>
    <text x="50" y="145" class="label">VM (Guest)</text>
    <rect class="internet" x="90" y="220" width="120" height="60" rx="30"/>
    <text x="110" y="255" class="label">Internet</text>
    <!-- Arrows -->
    <defs>
      <marker id="arr" markerWidth="10" markerHeight="10" refX="10" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L10,3 L0,6 Z" fill="#111827" />
      </marker>
    </defs>
    <!-- Shifted arrows to the right to avoid label overlap -->
    <line x1="270" y1="180" x2="270" y2="220" stroke="#111827" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="240" y1="220" x2="240" y2="180" stroke="#111827" stroke-width="2" marker-end="url(#arr)"/>
    <!-- White background under the label for clarity -->
    <rect x="18" y="192" width="210" height="22" fill="#ffffff"/>
    <text x="24" y="208" class="label">Host를 통해 외부로</text>
    <text x="40" y="320" class="label">외부→VM 직접 진입 기본 차단</text>
  </g>

  <g transform="translate(340,50)">
    <!-- Bridged Panel -->
    <rect class="box" x="0" y="0" width="300" height="340"/>
    <text x="20" y="30" class="label">Bridged</text>
    <rect class="host" x="20" y="60" width="120" height="60"/>
    <text x="30" y="95" class="label">Host</text>
    <rect class="vm" x="160" y="60" width="120" height="60"/>
    <text x="170" y="95" class="label">VM</text>
    <rect class="internet" x="90" y="220" width="120" height="60" rx="30"/>
    <text x="110" y="255" class="label">Internet</text>
    <!-- Arrows showing both act as peers -->
    <line x1="80" y1="120" x2="150" y2="220" stroke="#111827" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="200" y1="120" x2="170" y2="220" stroke="#111827" stroke-width="2" marker-end="url(#arr)"/>
    <text x="20" y="320" class="label">동일 네트워크의 독립 IP</text>
  </g>

  <g transform="translate(660,50)">
    <!-- Host-only Panel -->
    <rect class="box" x="0" y="0" width="300" height="340"/>
    <text x="20" y="30" class="label">Host-only</text>
    <rect class="host" x="20" y="60" width="120" height="60"/>
    <text x="30" y="95" class="label">Host</text>
    <rect class="vm" x="160" y="60" width="120" height="60"/>
    <text x="170" y="95" class="label">VM</text>
    <rect class="internet" x="90" y="220" width="120" height="60" rx="30" opacity="0.4"/>
    <text x="110" y="255" class="label" opacity="0.6">Internet</text>
    <!-- Bi-directional arrow between host and VM only -->
    <line x1="140" y1="90" x2="160" y2="90" stroke="#111827" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="160" y1="100" x2="140" y2="100" stroke="#111827" stroke-width="2" marker-end="url(#arr)"/>
    <text x="20" y="320" class="label">호스트↔게스트만 통신, 외부 단절</text>
  </g>
</svg>
